<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makerspace | Equipment Booking</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#242424;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.top{background:#fff;border-bottom:1px solid #e5e5e5;padding:17px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px}.logo{background:#0f6cbd;color:white;border-radius:6px;padding:9px}.tag{font-size:12px;color:#626262;background:#f1f1f1;border-radius:20px;padding:6px 10px}.wrap{max-width:1120px;margin:32px auto;padding:0 22px}.eyebrow{color:#616161;font-size:13px}.title{font-size:29px;margin:8px 0}.desc{color:#666;margin:0 0 24px}.steps{display:flex;gap:12px;margin-bottom:24px}.step{flex:1;border-top:4px solid #dedede;padding-top:10px;color:#777;font-size:13px}.step.active{border-color:#0f6cbd;color:#0f6cbd;font-weight:700}.step.done{border-color:#16834a;color:#16834a}.panel{background:white;border:1px solid #e4e4e4;border-radius:12px;padding:28px;box-shadow:0 3px 15px #00000006}.panel h2{font-size:21px;margin:0 0 6px}.muted{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.equipment{background:white;border:1px solid #dedede;border-radius:9px;padding:19px;text-align:left;min-height:145px}.equipment:hover:not(:disabled){border-color:#0f6cbd}.equipment.selected{border:2px solid #0f6cbd;background:#f0f7ff;padding:18px}.equipment.locked{background:#f4f4f4;color:#888}.eqicon{font-size:25px;margin-bottom:13px}.eqname{font-weight:650}.eqsub{font-size:12px;color:#666;margin-top:7px}.row{display:flex;gap:16px;align-items:center}.between{justify-content:space-between}.btn{border:1px solid #c6c6c6;background:white;border-radius:6px;padding:11px 18px;font-weight:600}.primary{background:#0f6cbd;color:white;border-color:#0f6cbd}.btn:hover:not(:disabled){filter:brightness(.96)}.actions{display:flex;justify-content:space-between;margin-top:24px;gap:12px}.toggle{display:flex;gap:10px;align-items:center;background:#f6f8fb;padding:14px;border-radius:8px;font-size:14px}.toggle input{width:18px;height:18px;accent-color:#0f6cbd}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:20px 0}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:600}.field input,.field select,.field textarea{border:1px solid #bdbdbd;border-radius:5px;padding:11px;background:#fff;width:100%}.field input:focus,.field select:focus{outline:2px solid #0f6cbd;outline-offset:1px}.calendar{border:1px solid #e3e3e3;border-radius:8px;padding:15px;margin-top:20px}.calendar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.slot{border:1px solid #d7e7f4;background:#f0f7ff;color:#175e91;border-radius:6px;padding:12px 5px;text-align:center;font-size:13px}.slot.booked{background:#e9e9e9;border-color:#ddd;color:#8a8a8a;text-decoration:line-through;cursor:not-allowed}.slot.chosen{background:#0f6cbd;color:#fff;border-color:#0f6cbd}.legend{display:flex;gap:18px;font-size:12px;color:#666;margin-top:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.notice{padding:13px;border-radius:6px;font-size:13px;margin-top:14px}.bad{background:#fff1f0;color:#a4262c;border:1px solid #f4c4c4}.good{background:#eaf6ee;color:#176c38;border:1px solid #c7e9d0}.info{background:#eff6fc;color:#195b91;border:1px solid #d5e6f5}.upload{border:2px dashed #b8c8d6;border-radius:8px;text-align:center;padding:22px;background:#fafcff}.upload input{max-width:100%;margin-top:12px}.summary{background:#f7f8fa;border:1px solid #e7e7e7;padding:20px;border-radius:8px;margin:20px 0}.summary-line{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #e5e5e5;font-size:14px}.summary-line:last-child{border-bottom:0}.success{font-size:50px;color:#16834a}.small{font-size:12px;color:#777}.pill{border-radius:20px;background:#e9f5ed;color:#176c38;font-size:11px;padding:4px 8px}.footer{text-align:center;color:#888;font-size:12px;padding:26px}.link{background:none;border:0;color:#0f6cbd;text-decoration:underline;padding:0}.hide{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.calendar-grid{grid-template-columns:repeat(3,1fr)}.fields{grid-template-columns:1fr}.panel{padding:18px}.steps{gap:5px}.step{font-size:11px}.top{padding:14px 20px}}@media(max-width:440px){.grid{grid-template-columns:1fr}.row.between{align-items:flex-start}}

/* Guided entry and accessible help */
.field label{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.required-entry{background:#f0f7ff;border:1px solid #bdd9f1;border-radius:9px;padding:13px}.required-entry input,.required-entry select{border:2px solid #0f6cbd}.entry-chip{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:#075a9c;background:#dceeff;padding:3px 7px;border-radius:20px}.help{position:relative;display:inline-flex;align-items:center}.help-btn{border:1px solid #8eb7d8;border-radius:50%;width:21px;height:21px;background:#eaf4ff;color:#075a9c;font-weight:700;font-size:12px;display:inline-grid;place-items:center;padding:0;cursor:help}.help-pop{display:none;position:absolute;z-index:20;left:0;top:28px;width:min(330px,calc(100vw - 75px));padding:13px 15px;background:#fff;color:#242424;border:1px solid #bfd3e3;border-radius:9px;box-shadow:0 10px 30px #0002;font-size:12px;line-height:1.5;font-weight:400}.help:hover .help-pop,.help:focus-within .help-pop{display:block}.help-pop strong{display:block;margin-bottom:4px}.help-pop svg{width:100%;height:auto;margin-top:9px;border-radius:5px}.helper-note{color:#546579;font-size:12px}.upload-title{display:flex;align-items:center;justify-content:center;gap:8px}.consult-icon{color:#0f6cbd}.help-pop.wide{width:min(460px,calc(100vw - 75px))}@media(max-width:700px){.help-pop{left:auto;right:-20px}}
</style></head><body><header class="top"><div class="brand"><span class="logo">M</span> Makerspace <span style="color:#aaa;font-weight:400">/ Reservations</span></div><span class="tag">Interactive prototype</span></header><main class="wrap"><div class="eyebrow">MAKERSPACE SERVICES / EQUIPMENT</div><h1 class="title">Book equipment</h1><p class="desc">Reserve shared Makerspace equipment in a few simple steps.</p><nav class="steps" id="steps"></nav><section class="panel" id="screen"></section><div class="footer">Demonstration only · Sample reservations and training records · No data is sent to a server</div></main><script>
const equipment=[...Array.from({length:5},(_,i)=>({id:'P'+(i+1),name:'3D Printer '+(i+1),kind:'printer',icon:'▣'})),{id:'W1',name:'Workstation 1',kind:'workstation',icon:'▤'},{id:'W2',name:'Workstation 2',kind:'workstation',icon:'▤'},{id:'PJ',name:'PolyJet Printer',kind:'polyjet',icon:'◆'},{id:'C1',name:'Makerspace Consultation',kind:'consultation',icon:'◉'}];
const dateISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const tomorrow=()=>{let d=new Date();d.setDate(d.getDate()+1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const sampleDate=tomorrow();let reservations=[{id:'DEMO-101',device:'P1',date:sampleDate,start:9,end:12},{id:'DEMO-102',device:'P1',date:sampleDate,start:15,end:18},{id:'DEMO-103',device:'P2',date:sampleDate,start:12,end:16},{id:'DEMO-104',device:'P3',date:sampleDate,start:9,end:11},{id:'DEMO-105',device:'W1',date:sampleDate,start:14,end:17},{id:'DEMO-106',device:'PJ',date:sampleDate,start:10,end:13}];
let state={step:1,device:'P1',trained:false,date:sampleDate,start:13,duration:120,material:'PLA',weight:'50',screenshot:null,printTime:'105',purpose:'',ack:false,confirmed:null};const $=id=>document.getElementById(id);const selected=()=>equipment.find(e=>e.id===state.device);const fmt=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0');const end=()=>state.start+Number(state.duration)/60;const overlaps=(a,b,c,d)=>a<d&&c<b;const conflict=()=>reservations.some(r=>r.device===state.device&&r.date===state.date&&overlaps(state.start,end(),r.start,r.end));const unavailable=h=>reservations.some(r=>r.device===state.device&&r.date===state.date&&overlaps(h,h+1,r.start,r.end));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStep(n){state.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}function steps(){let labels=['Select equipment','Choose time','Print details','Confirmation'];$('steps').innerHTML=labels.map((x,i)=>`<div class="step ${state.step===i+1?'active':state.step>i+1?'done':''}">${i+1}. ${x}</div>`).join('')}
function render(){steps();let s=$('screen');if(state.step===1){s.innerHTML=`<h2>Select equipment</h2><p class="muted">Choose a printer, workstation, or specialist device to reserve.</p><div class="grid">${equipment.map(e=>{let locked=e.kind==='polyjet'&&!state.trained;return `<button class="equipment ${locked?'locked':''} ${state.device===e.id?'selected':''}" ${locked?'disabled':''} onclick="choose('${e.id}')"><div class="eqicon">${locked?'🔒':e.icon}</div><div class="eqname">${e.name}</div><div class="eqsub">${locked?'Training required':e.kind==='workstation'?'Shared workstation':e.kind==='consultation'?'Book a guidance session':e.kind==='polyjet'?'Specialist equipment · Trained':'FDM 3D printing · Bookable'}</div></button>`}).join('')}</div><label class="toggle"><input type="checkbox" id="trained" ${state.trained?'checked':''} onchange="training(this.checked)"><span><strong>Demo control: PolyJet training completed</strong><br><span class="small">Toggle to demonstrate how training unlocks restricted equipment.</span></span></label><div class="actions"><span></span><button class="btn primary" onclick="setStep(2)">Continue →</button></div>`}
else if(state.step===2){let timeOptions=Array.from({length:32},(_,i)=>8+i*.5).map(h=>`<option value="${h}" ${state.start===h?'selected':''}>${fmt(h)}</option>`).join('');s.innerHTML=`<h2>Choose your reservation</h2><p class="muted">${selected().name} · Reserve the full equipment usage time or consultation session.</p><div class="fields"><div class="field"><label for="date">Booking date</label><input id="date" type="date" min="${dateISO()}" value="${state.date}" onchange="updateDate(this.value)"></div><div class="field"><label for="duration">Total duration</label><select id="duration" onchange="updateDuration(this.value)">${[30,60,90,120,180,240,360,480,720].map(m=>`<option value="${m}" ${Number(state.duration)===m?'selected':''}>${m>=60?`${m/60} hour${m===60?'':'s'}`:`${m} minutes`}</option>`).join('')}</select></div></div><div class="calendar"><strong>Equipment availability</strong><div class="muted" style="margin-top:5px">Select a start time. Grey slots are already reserved. Each cell represents one hour.</div><div class="calendar-grid">${Array.from({length:12},(_,i)=>i+8).map(h=>`<button class="slot ${unavailable(h)?'booked':''} ${state.start===h?'chosen':''}" ${unavailable(h)?'disabled':''} onclick="updateStart(${h})">${fmt(h)}<br><small>${unavailable(h)?'Booked':'Available'}</small></button>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#e9e9e9"></i>Booked</span><span><i class="dot" style="background:#f0f7ff;border:1px solid #b4d2ed"></i>Available</span><span><i class="dot" style="background:#0f6cbd"></i>Selected start</span></div></div><div class="fields"><div class="field"><label for="start">Start time (30-minute increments)</label><select id="start" onchange="updateStart(Number(this.value))">${timeOptions}</select></div><div class="field"><label>Calculated end time</label><input value="${fmt(end())}${end()>24?' (next day)':''}" disabled></div></div><div class="notice ${conflict()||end()>24?'bad':'good'}">${end()>24?'✕ Booking extends beyond midnight. Choose a shorter duration or earlier start.':conflict()?'✕ This booking overlaps an existing reservation. Select another time or device.':'✓ The full requested duration is available.'}</div><div class="actions"><button class="btn" onclick="setStep(1)">← Back</button><button class="btn primary" ${conflict()||end()>24?'disabled':''} onclick="setStep(3)">Continue →</button></div>`}
else if(state.step===3){let printer=!['workstation','consultation'].includes(selected().kind);s.innerHTML=`<h2>${printer?'Print verification':selected().kind==='consultation'?'Consultation details':'Workstation details'}</h2><p class="muted">${selected().name} · ${state.date} · ${fmt(state.start)}–${fmt(end())} · ${state.duration} minutes</p>${printer?`<div class="fields"><div class="field required-entry"><label for="printTime">Slicer print time (minutes) * <span class="entry-chip">Enter value</span><span class="help"><button type="button" class="help-btn" aria-label="Where to find print time">i</button><span class="help-pop" role="tooltip"><strong>Where can I find print time?</strong>After slicing your model in PrusaSlicer (or your chosen slicer), look for the estimated print time in the sliced preview or export summary. Enter that estimate here. <strong>Tip: allow about 15 extra minutes</strong> in your total reservation for loading, setup and unloading the print.</span></span></label><input id="printTime" type="number" min="1" step="1" value="${esc(state.printTime)}" oninput="state.printTime=this.value;updatePrintHint()"><span class="helper-note">Slicer estimate only; reserve approximately 15 additional minutes.</span></div><div class="field required-entry"><label for="material">Print material * <span class="entry-chip">Select value</span><span class="help"><button type="button" class="help-btn" aria-label="What is print material?">i</button><span class="help-pop" role="tooltip"><strong>Print material</strong>The filament or resin your model uses (for example PLA, PETG or TPU). Choose the material shown in your slicer so Makerspace staff can track material use and check suitability for the machine.</span></span></label><select id="material" onchange="state.material=this.value">${['PLA','PETG','ABS','TPU','Resin','PolyJet resin','Other'].map(x=>`<option ${state.material===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field required-entry"><label for="weight">Estimated material usage (g) * <span class="entry-chip">Enter value</span><span class="help"><button type="button" class="help-btn" aria-label="Where to find material quantity?">i</button><span class="help-pop" role="tooltip"><strong>Material quantity</strong>Enter the estimated filament or resin consumption from the slicer summary, in grams. This is not the total weight of your spool. If the slicer displays metres or volume instead, switch to grams where possible.</span></span></label><input id="weight" type="number" min="0.1" step="0.1" value="${esc(state.weight)}" oninput="state.weight=this.value"></div></div><div class="notice info" id="print-hint"></div><div class="upload"><div style="font-size:28px">⇧</div><div class="upload-title"><strong>Slicer screenshot *</strong><span class="help"><button type="button" class="help-btn" aria-label="View example slicer screenshot">i</button><span class="help-pop wide" role="tooltip"><strong>Example slicer screenshot (illustrative PrusaSlicer-style mockup)</strong>Capture your sliced model with the estimated print time and material consumption visible. The highlighted boxes below show what staff should be able to verify.<svg viewBox="0 0 440 265" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative PrusaSlicer-style preview with print time and filament grams highlighted"><rect width="440" height="265" rx="7" fill="#edf1f5"/><rect width="440" height="29" rx="7" fill="#2e3641"/><text x="13" y="19" font-size="12" fill="white" font-family="Arial">PrusaSlicer — Preview (illustrative)</text><rect x="9" y="39" width="268" height="216" rx="4" fill="#dbe7ee"/><path d="M30 208L147 237L255 200L140 170Z" fill="#b6c5cd" stroke="#8499a4"/><path d="M112 112L171 127L173 185L115 172Z" fill="#f9a44d" stroke="#ba6627" stroke-width="2"/><path d="M112 112L140 91L200 107L171 127Z" fill="#ffc478" stroke="#ba6627" stroke-width="2"/><path d="M171 127L200 107L199 166L173 185Z" fill="#e17b2f" stroke="#ba6627" stroke-width="2"/><rect x="287" y="39" width="144" height="216" rx="4" fill="#fff"/><text x="297" y="58" font-size="11" font-weight="bold" fill="#253648">Sliced print summary</text><text x="297" y="81" font-size="10" fill="#52606e">Estimated print time</text><rect x="293" y="88" width="131" height="37" rx="4" fill="#fff5c2" stroke="#e0a400" stroke-width="2"/><text x="302" y="111" font-size="17" font-weight="bold" fill="#333">2h 15m</text><text x="297" y="146" font-size="10" fill="#52606e">Filament used</text><rect x="293" y="153" width="131" height="37" rx="4" fill="#fff5c2" stroke="#e0a400" stroke-width="2"/><text x="302" y="176" font-size="16" font-weight="bold" fill="#333">42.8 g</text><text x="297" y="209" font-size="10" fill="#52606e">Material: PLA</text><text x="297" y="228" font-size="9" fill="#697a89">Values are examples only</text></svg><span class="helper-note">Example illustration, not a screenshot from the PrusaSlicer application.</span></span></span></div><p class="muted">Upload an image showing the sliced model, estimated print duration, and material consumption.</p><input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp" onchange="onFile(this)"><div class="small" id="file-status">${state.screenshot?'Selected: '+esc(state.screenshot.name):'PNG, JPG or WebP · Max 10 MB'}</div></div><div class="notice info">ⓘ Estimated slicer print time plus a 15-minute buffer should fit within the reserved duration. In this demo, verification is a required upload; screenshot contents are not automatically inspected.</div>`:`<div class="field" style="margin:22px 0"><label for="purpose">${selected().kind==='consultation'?'What would you like help with? *':'Purpose of workstation use *'}</label><textarea id="purpose" rows="4" oninput="state.purpose=this.value" placeholder="${selected().kind==='consultation'?'Briefly describe your project or questions for the consultation':'Describe your planned workstation activity'}">${esc(state.purpose)}</textarea></div>`}<label class="toggle" style="margin-top:20px"><input id="ack" type="checkbox" ${state.ack?'checked':''} onchange="state.ack=this.checked"><span>I confirm this booking covers the full equipment usage period and I will follow Makerspace safety requirements.</span></label><div id="validation"></div><div class="actions"><button class="btn" onclick="setStep(2)">← Back</button><button class="btn primary" onclick="submit()">Confirm booking →</button></div>`}
else{let r=state.confirmed;s.innerHTML=`<div style="text-align:center"><div class="success">✓</div><h2>Booking confirmed</h2><p class="muted">Your reservation has been added to this browser's demo calendar.</p><span class="pill">Confirmed · ${r.id}</span></div><div class="summary">${[['Booking reference',r.id],['Equipment',r.name],['Date',r.date],['Time',fmt(r.start)+' – '+fmt(r.end)],['Duration',r.duration+' minutes'],...(!['workstation','consultation'].includes(r.kind)?[['Slicer print time',r.printTime+' minutes'],['Material',r.material],['Estimated usage',r.weight+' g'],['Slicer screenshot',r.screenshot]]:[[r.kind==='consultation'?'Consultation topic':'Purpose',r.purpose]])].map(([a,b])=>`<div class="summary-line"><span class="muted">${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('')}</div><div class="notice info">This is a demonstration only. No email was sent and no external booking system was updated. Your new reservation will block the selected time during this session.</div><div class="actions"><button class="btn" onclick="resetDemo()">Reset sample data</button><button class="btn primary" onclick="newBooking()">Book another device →</button></div>`}}
function updatePrintHint(){const el=$('print-hint');if(!el)return;const n=Number(state.printTime);el.textContent=Number.isFinite(n)&&n>0?'Suggested minimum reservation: '+(n+15)+' minutes ('+n+' min print + 15 min handling). Your selected booking is '+state.duration+' minutes. '+(Number(state.duration)<n+15?'⚠ Consider extending your booking.':'✓ Duration covers the suggested buffer.'):'Enter the estimated print time from your slicer.';el.className='notice '+(n>0&&Number(state.duration)<n+15?'bad':'info')}function choose(id){state.device=id;render()}function training(v){state.trained=v;if(!v&&state.device==='PJ')state.device='P1';render()}function updateDate(v){state.date=v;render()}function updateDuration(v){state.duration=Number(v);render()}function updateStart(v){state.start=v;render()}function onFile(el){const f=el.files[0];if(!f){state.screenshot=null;return}if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){alert('Choose a PNG, JPG or WebP image under 10 MB.');el.value='';state.screenshot=null;return}state.screenshot={name:f.name,size:f.size};$('file-status').textContent='Selected: '+f.name}
function submit(){let e=selected(),printer=e.kind!=='workstation',issues=[];if(conflict()||end()>24)issues.push('Selected time is no longer available.');if(e.kind==='polyjet'&&!state.trained)issues.push('PolyJet training is required.');if(printer&&(!Number.isFinite(Number(state.printTime))||Number(state.printTime)<=0))issues.push('Enter the slicer estimated print time.');if(printer&&Number(state.duration)<Number(state.printTime)+15)issues.push('Reserve at least the slicer estimate plus a 15-minute handling buffer.');if(printer&&(!Number.isFinite(Number(state.weight))||Number(state.weight)<=0))issues.push('Enter valid material usage.');if(printer&&!state.screenshot)issues.push('Upload a slicer screenshot.');if(!printer&&!state.purpose.trim())issues.push('Enter the purpose of the booking.');if(!state.ack)issues.push('Confirm the safety and duration declaration.');if(issues.length){$('validation').innerHTML='<div class="notice bad">'+issues.map(esc).join('<br>')+'</div>';return}let id='DEMO-'+Math.floor(1000+Math.random()*9000);let r={id,device:state.device,date:state.date,start:state.start,end:end()};reservations.push(r);state.confirmed={...r,name:e.name,kind:e.kind,duration:state.duration,printTime:state.printTime,material:state.material,weight:state.weight,screenshot:state.screenshot?.name||'',purpose:state.purpose};setStep(4)}function newBooking(){state.screenshot=null;state.ack=false;state.confirmed=null;state.purpose='';setStep(1)}function resetDemo(){reservations=reservations.filter(r=>r.id.startsWith('DEMO-10'));newBooking()}render();
document.addEventListener('DOMContentLoaded',()=>updatePrintHint());const originalSetStep=setStep;setStep=function(n){originalSetStep(n);if(n===3)updatePrintHint()};</script></body></html>
